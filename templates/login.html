<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIOSITO - Inicio de Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        function toggleTheme() {
            const doc = document.documentElement;
            const newTheme = doc.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            doc.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            const btn = document.getElementById('themeToggleBtn');
            if(btn) btn.innerText = newTheme === 'dark' ? '☀️' : '🌙';
        }
    </script>
</head>
<body>
    <button id="themeToggleBtn" onclick="toggleTheme()" style="position:fixed; top:20px; right:20px; width:45px; height:45px; border-radius:50%; background:var(--card-bg); border:2px solid var(--primary); font-size:1.5rem; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; z-index:100; box-shadow:var(--shadow);" title="Modo oscuro/claro">🌙</button>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('themeToggleBtn');
            if(btn) btn.innerText = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
        });
    </script>
    <div class="auth-container">
        <div class="auth-box">
            <h1>🐻 LIOSITO</h1>
            <p>Tu asistente amigable para proyectos LIA</p>

            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}
            {% if error_register %}
                <div class="error">{{ error_register }}</div>
            {% endif %}

            <div id="login-form">
                <form action="{{ url_for('login') }}" method="POST">
                    <input type="text" name="nombre_usuario" placeholder="Nombre de Usuario" required>
                    <input type="password" name="password" placeholder="Contraseña" required>
                    <button type="submit">Ingresar</button>
                </form>
                <p style="margin-top: 15px; font-size: 0.9em;">
                    ¿Eres nuevo? <a href="#" onclick="toggleAuth(event)" style="color: var(--primary);">Regístrate aquí</a>
                </p>
            </div>

            <div id="register-form" style="display: none;">
                <form action="{{ url_for('register') }}" method="POST">
                    <input type="text" name="nombre_usuario" placeholder="Usuario LIA" required>
                    <input type="password" name="password" placeholder="Contraseña secreta" required>
                    <input type="text" name="github_user" placeholder="Usuario de GitHub">
                    <h4 style="color: var(--primary); text-align: left; margin-bottom: 5px;">Tus Skills (1-10)</h4>
                    <div style="display:flex; gap:5px;">
                        <input type="number" name="skill_programacion" min="1" max="10" placeholder="Prog (ej. 5)">
                        <input type="number" name="skill_electronica" min="1" max="10" placeholder="Elec (ej. 3)">
                        <input type="number" name="skill_logistica" min="1" max="10" placeholder="Log (ej. 4)">
                    </div>
                    <button type="submit" class="btn-secondary">Registrarme</button>
                </form>
                <p style="margin-top: 15px; font-size: 0.9em;">
                    ¿Ya tienes cuenta? <a href="#" onclick="toggleAuth(event)" style="color: var(--secondary);">Vuelve al login</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        function toggleAuth(e) {
            e.preventDefault();
            const login = document.getElementById('login-form');
            const reg = document.getElementById('register-form');
            if (login.style.display === 'none') {
                login.style.display = 'block';
                reg.style.display = 'none';
            } else {
                login.style.display = 'none';
                reg.style.display = 'block';
            }
        }
    </script>
</body>
</html>
